<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arrais">
<meta name="theme-color" content="#f3f6f8">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<title>Arrais Amador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: coluna única — temas com Estudar/Desafio, avaliação geral no topo; faixa com as luzes de bordo (encarnada | branca | verde) */
:root{
  --paper:#f3f6f8; --card:#ffffff; --ink:#13263b; --muted:#5f7286; --line:#d6e0e8; --navy:#1b4f7a;
  --verde:#0b8a4a; --verde-bg:#e2f3e9; --rosso:#cf2e3a; --rosso-bg:#fbe5e6; --gold:#f2b531;
  --display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif; --body:'Nunito','Trebuchet MS',sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:linear-gradient(90deg,var(--rosso) 0 33.3%,#fff 33.3% 66.6%,var(--verde) 66.6%);background-size:100% 6px;background-repeat:no-repeat}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.back{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:19px;font-weight:600}
.sub{color:var(--muted);margin:0;font-weight:700;font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
button{font:700 16px/1.25 var(--body);color:var(--ink);cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:12px 14px;min-height:46px}
button:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.opt:disabled{opacity:1;cursor:default}
.btn-main{background:var(--navy);border-color:var(--navy);color:#fff;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 4px 0 #0f3352}
.btn-go{background:var(--rosso);border-color:var(--rosso);color:#fff;box-shadow:0 4px 0 #9b1f28}
.btn-main:active,.btn-go:active{transform:translateY(2px);box-shadow:none}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--line);color:var(--ink)}
/* hub */
.exam{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.exam .btn-main{grid-column:1/-1}
.big{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column;gap:12px}
.topic{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center}
.topic .ico{font-size:30px;line-height:1;grid-row:span 2;text-align:center}
.topic .rec{font-size:14px;color:var(--muted);font-weight:700}
.topic .rec b{color:var(--ink)}
.topic .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--verde)}
/* estudo */
.fig{background:#f7f9fb;border:1px solid var(--line);border-radius:14px;padding:6px}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.pts b{color:var(--navy)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--navy)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sons{width:100%;border-collapse:collapse;font-size:15px}
.sons td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
.sons td:first-child{white-space:nowrap;width:1%;padding-right:12px}
.sons small{color:var(--muted);font-weight:700}
i.c,i.l{display:inline-block;height:10px;border-radius:5px;background:var(--navy);margin-right:4px;vertical-align:middle}
i.c{width:10px} i.l{width:34px}
.leg{margin:0;font-size:14px;color:var(--muted);font-weight:700}
/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--verde);border-radius:999px;transition:width .25s linear,background .3s}
.q{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.3;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;font-weight:700}
.opt .l{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-family:var(--display);font-weight:700;text-transform:uppercase}
.opt.sel{border-color:var(--navy)} .opt.sel .l{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt.ok{border-color:var(--verde);background:var(--verde-bg)} .opt.ok .l{background:var(--verde);border-color:var(--verde);color:#fff}
.opt.no{border-color:var(--rosso);background:var(--rosso-bg)} .opt.no .l{background:var(--rosso);border-color:var(--rosso);color:#fff}
.fb{border-radius:14px;padding:10px 12px;font-weight:700;background:var(--verde-bg);color:var(--verde)}
.fb.no{background:var(--rosso-bg);color:var(--rosso)}
.fb small{display:block;color:var(--muted);font-weight:700;margin-top:4px}
.grid40{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.grid40 button{padding:0;min-height:34px;font-size:13px;border-radius:8px;border-width:1.5px}
.grid40 .done{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid40 .cur{outline:3px solid var(--gold);outline-offset:1px}
.grid40 .ok{background:var(--verde);color:#fff;border-color:var(--verde)}
.grid40 .no{background:var(--rosso);color:#fff;border-color:var(--rosso)}
.result{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.verdict{font:700 22px/1.1 var(--display)}
.err{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.err .a{color:var(--verde);font-weight:800}
.err .m{color:var(--rosso);font-weight:700}
.err small{color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>button{flex:1}
.linkbtn{background:none;border:0;padding:0;min-height:0;color:var(--muted);text-decoration:underline;font-weight:700}
.bytopic{display:flex;flex-direction:column;gap:6px;font-size:15px}
.bytopic div{display:flex;justify-content:space-between;gap:10px}
.bytopic span:last-child{font-variant-numeric:tabular-nums;font-weight:800}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="questoes.js"></script>
<script src="estudo.js"></script>
<script>
const NPROVA=40, TEMPO_PROVA=2*60*60, NDESAFIO=5, TEMPO_Q=30;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=QUESTOES.map(([t,q,o,c,n],id)=>({id,t,q,o,c,n:n||''}));
const TEMA=Object.fromEntries(TEMAS.map(t=>[t.id,t]));
const get=(k,d=0)=>{try{const v=localStorage.getItem(k);return v==null?d:+v}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let tick=null; let S=null;
function stop(){clearInterval(tick);tick=null}
function go(h){if(location.hash!=='#'+h)location.hash=h;else route()}
addEventListener('hashchange',route);
function route(){
  stop();
  const h=location.hash.slice(1);
  const m=h.match(/^(estudo|desafio)-([a-z]+)$/);
  if(m&&TEMA[m[2]]) return m[1]==='estudo'?estudo(m[2],0):desafio(m[2]);
  if(h==='avaliacao') return prova();
  hub();
}
function topbar(back){return `<div class="top">${back?`<button class="back" id="bk">‹ Temas</button>`:`<a class="back" href="../">‹ Fliperama</a>`}<span class="chip">Arrais Amador</span></div>`}
function bindBack(){const b=document.getElementById('bk');if(b)b.onclick=()=>go('')}

/* ---------- Tela inicial ---------- */
function hub(){
  const best=get('arrais-geral-best',-1);
  app.innerHTML=topbar(false)+`
  <header><h1>Arrais Amador</h1><p class="sub">${Q.length} questões de prova em ${TEMAS.length} temas</p></header>
  <section class="card exam">
    <div><h2>Avaliação geral</h2><p class="sub">40 questões de todos os temas, 2 horas, aprova com 20 acertos</p></div>
    <div style="text-align:right"><div class="big">${best<0?'–':best+'/40'}</div><span class="sub">recorde</span></div>
    <button class="btn-main" id="prova">Começar avaliação</button>
  </section>
  <section class="topics">${TEMAS.map(t=>{const n=Q.filter(q=>q.t===t.id).length;const b=get('arrais-'+t.id+'-best',-1);const ac=get('arrais-'+t.id+'-acertos',-1);
    return `<article class="card topic"><span class="ico" aria-hidden="true">${t.icone}</span><h3>${esc(t.nome)}</h3>
    <span class="rec">${n} questões · ${b<0?'desafio não feito':`recorde <b>${b}</b> pts (${ac}/5)`}</span>
    <span class="meter"><i style="width:${ac<0?0:ac*20}%"></i></span>
    <div class="acts"><button data-e="${t.id}">Estudar</button><button class="btn-go" data-d="${t.id}">Desafio ⏱</button></div></article>`}).join('')}</section>
  <p class="sub" style="text-align:center">Resumos e figuras feitos para revisão. Gabaritos conforme o banco de questões da prova.</p>`;
  document.getElementById('prova').onclick=()=>go('avaliacao');
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>go('estudo-'+b.dataset.e));
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>go('desafio-'+b.dataset.d));
  scrollTo(0,0);
}

/* ---------- Estudar ---------- */
function estudo(id,i){
  const t=TEMA[id], c=t.cards[i], last=i===t.cards.length-1;
  app.innerHTML=topbar(true)+`
  <header><h1>${t.icone} ${esc(t.nome)}</h1><p class="sub">Estudar · cartão ${i+1} de ${t.cards.length}</p></header>
  <section class="card">
    <h2>${esc(c.t)}</h2>
    ${c.f?`<div class="fig">${c.f}</div>`:''}
    ${c.h||''}
    <ul class="pts">${c.p.map(p=>`<li>${p}</li>`).join('')}</ul>
    <div class="dots">${t.cards.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <div class="nav"><button id="ant" ${i?'':'disabled'}>Anterior</button>${last?`<button class="btn-go" id="des">Fazer o desafio ⏱</button>`:`<button class="btn-main" id="prx">Próximo</button>`}</div>
  </section>`;
  bindBack();
  document.getElementById('ant').onclick=()=>{estudo(id,i-1);scrollTo(0,0)};
  if(last) document.getElementById('des').onclick=()=>go('desafio-'+id);
  else document.getElementById('prx').onclick=()=>{estudo(id,i+1);scrollTo(0,0)};
  scrollTo(0,0);
}

/* ---------- Desafio: 5 questões do tema, 30 s cada ---------- */
function desafio(id){
  const pool=shuffle(Q.filter(q=>q.t===id)).slice(0,NDESAFIO);
  S={mode:'d',id,items:pool.map(q=>({q,ord:shuffle([0,1,2,3]),pick:null,timeout:false})),i:0,pts:0,ok:0};
  desafioQ();
}
function desafioQ(){
  stop();
  const it=S.items[S.i], t=TEMA[S.id]; let left=TEMPO_Q; const t0=Date.now();
  const render=()=>{
    const done=it.pick!==null||it.timeout;
    app.innerHTML=topbar(true)+`
    <section class="card">
      <div class="qmeta"><span>${t.icone} Desafio · ${S.i+1} de ${S.items.length}</span><span>${S.pts} pts</span></div>
      <div class="timer" aria-hidden="true"><i id="bar" style="width:${100*left/TEMPO_Q}%"></i></div>
      <p class="q">${esc(it.q.q)}</p>
      <div class="opts">${opts(it,done)}</div>
      ${done?fb(it):''}
      ${done?`<button class="btn-main" id="nx">${S.i+1<S.items.length?'Próxima':'Ver resultado'}</button>`:''}
    </section>`;
    bindBack();
    if(!done) app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.o));
    else document.getElementById('nx').onclick=()=>{if(S.i+1<S.items.length){S.i++;desafioQ()}else fimDesafio()};
  };
  const answer=o=>{stop();it.pick=o;if(o===it.q.c){S.ok++;S.pts+=100+Math.round(3*left)}render()};
  render(); scrollTo(0,0);
  tick=setInterval(()=>{left=Math.max(0,TEMPO_Q-(Date.now()-t0)/1000);const bar=document.getElementById('bar');
    if(bar){bar.style.width=(100*left/TEMPO_Q)+'%';bar.style.background=left<8?'var(--rosso)':left<15?'var(--gold)':'var(--verde)'}
    if(left<=0){stop();it.timeout=true;render()}},250);
}
function opts(it,reveal){
  return it.ord.map((oi,k)=>{let c='opt';if(reveal){if(oi===it.q.c)c+=' ok';else if(oi===it.pick)c+=' no'}else if(oi===it.pick)c+=' sel';
    return `<button class="${c}" data-o="${oi}" ${reveal&&S.mode==='d'?'disabled':''}><span class="l">${'abcd'[k]}</span><span>${esc(it.q.o[oi])}</span></button>`}).join('');
}
function fb(it){
  const ok=it.pick===it.q.c;
  return `<div class="fb ${ok?'':'no'}">${ok?'Certo!':it.timeout?'Acabou o tempo. Resposta: '+esc(it.q.o[it.q.c]):'Errou. Resposta: '+esc(it.q.o[it.q.c])}${it.q.n?`<small>${esc(it.q.n)}</small>`:''}</div>`;
}
function fimDesafio(){
  const t=TEMA[S.id], kb='arrais-'+S.id+'-best', best=get(kb,-1), novo=S.pts>best;
  if(novo){set(kb,S.pts);set('arrais-'+S.id+'-acertos',S.ok)}
  const erros=S.items.filter(x=>x.pick!==x.q.c);
  app.innerHTML=topbar(true)+`
  <section class="card">
    <span class="chip">${t.icone} ${esc(t.nome)}</span>
    <div class="result"><div class="big">${S.ok}/${S.items.length}</div><div class="verdict" style="color:var(--navy)">${S.pts} pts</div></div>
    <p class="sub">${novo?'Novo recorde neste tema!':`Recorde: ${best} pts`}${erros.length?' Os erros estão abaixo.':' Acertou tudo.'}</p>
    <div class="row"><button class="btn-go" id="again">Novo desafio</button><button id="est">Estudar o tema</button></div>
    ${erros.map(x=>`<div class="err"><div>${esc(x.q.q)}</div><div class="a">✓ ${esc(x.q.o[x.q.c])}</div>${x.pick!==null?`<div class="m">✗ ${esc(x.q.o[x.pick])}</div>`:'<small>Sem resposta (tempo)</small>'}${x.q.n?`<small>${esc(x.q.n)}</small>`:''}</div>`).join('')}
  </section>`;
  bindBack();
  document.getElementById('again').onclick=()=>desafio(S.id);
  document.getElementById('est').onclick=()=>go('estudo-'+S.id);
  scrollTo(0,0);
}

/* ---------- Avaliação geral: 40 questões, proporcional aos temas, 2 h ---------- */
function sorteiaProva(){
  const by={};Q.forEach(q=>(by[q.t]=by[q.t]||[]).push(q));
  const ts=Object.keys(by), quota={};let soma=0;
  ts.forEach(t=>{quota[t]=Math.floor(NPROVA*by[t].length/Q.length);soma+=quota[t]});
  shuffle(ts).sort((a,b)=>(NPROVA*by[b].length/Q.length%1)-(NPROVA*by[a].length/Q.length%1)).forEach(t=>{if(soma<NPROVA){quota[t]++;soma++}});
  return shuffle(ts.flatMap(t=>shuffle(by[t]).slice(0,quota[t])));
}
function prova(){
  S={mode:'p',items:sorteiaProva().map(q=>({q,ord:shuffle([0,1,2,3]),pick:null})),i:0,end:Date.now()+TEMPO_PROVA*1000};
  provaQ();
  tick=setInterval(()=>{const ms=S.end-Date.now();const el=document.getElementById('clock');if(ms<=0){fimProva();return}if(el)el.textContent=fmt(ms)},1000);
}
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
function provaQ(){
  const it=S.items[S.i], n=S.items.length, feitas=S.items.filter(x=>x.pick!==null).length;
  app.innerHTML=`<div class="top"><button class="back" id="sair">‹ Sair</button><span class="chip">⏱ <span id="clock">${fmt(S.end-Date.now())}</span></span></div>
  <section class="card">
    <div class="qmeta"><span>Questão ${S.i+1} de ${n}</span><span>${feitas} respondidas</span></div>
    <p class="q">${esc(it.q.q)}</p>
    <div class="opts">${opts(it,false)}</div>
    <div class="nav"><button id="ant" ${S.i?'':'disabled'}>Anterior</button><button class="btn-main" id="prx">${S.i<n-1?'Próxima':'Ir para entrega'}</button></div>
  </section>
  <section class="card">
    <div class="grid40">${S.items.map((x,k)=>`<button data-k="${k}" class="${x.pick!==null?'done':''} ${k===S.i?'cur':''}" aria-label="Questão ${k+1}">${k+1}</button>`).join('')}</div>
    <button class="btn-go" id="fin">Entregar prova (${feitas}/${n})</button>
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.pick=+b.dataset.o;
    if(S.i<n-1){provaQ();setTimeout(()=>{S.i++;provaQ()},180)}else provaQ()});
  app.querySelectorAll('.grid40 button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.k;provaQ()});
  document.getElementById('ant').onclick=()=>{S.i--;provaQ()};
  document.getElementById('prx').onclick=()=>{if(S.i<n-1){S.i++;provaQ();scrollTo(0,0)}else document.getElementById('fin').scrollIntoView({block:'center'})};
  const fin=document.getElementById('fin');fin.onclick=()=>{if(feitas<n&&!fin.dataset.c){fin.dataset.c=1;fin.textContent=`Faltam ${n-feitas}. Toque de novo para entregar`;return}fimProva()};
  const sair=document.getElementById('sair');sair.onclick=()=>{if(sair.dataset.c)go('');else{sair.dataset.c=1;sair.textContent='Sair sem nota?'}};
}
function fimProva(){
  stop();
  const n=S.items.length, ok=S.items.filter(x=>x.pick===x.q.c).length, pass=ok>=n/2;
  const best=get('arrais-geral-best',-1); if(ok>best) set('arrais-geral-best',ok);
  const por={};S.items.forEach(x=>{const p=por[x.q.t]=por[x.q.t]||[0,0];p[1]++;if(x.pick===x.q.c)p[0]++});
  const erros=S.items.map((x,k)=>({...x,k})).filter(x=>x.pick!==x.q.c);
  app.innerHTML=topbar(true)+`
  <section class="card">
    <h2>Resultado da avaliação</h2>
    <div class="result"><div class="big">${ok}/${n}</div><div class="verdict" style="color:var(${pass?'--verde':'--rosso'})">${pass?'Aprovado':'Reprovado'} · ${Math.round(100*ok/n)}%</div></div>
    <p class="sub">${ok>best?'Novo recorde!':`Recorde: ${best}/40`}</p>
    <div class="grid40">${S.items.map((x,k)=>`<button data-k="${k}" class="${x.pick===x.q.c?'ok':'no'}">${k+1}</button>`).join('')}</div>
    <h3>Por tema</h3>
    <div class="bytopic">${Object.entries(por).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([t,[a,b]])=>`<div><span>${TEMA[t].icone} ${esc(TEMA[t].nome)}</span><span style="color:var(${a/b>=.5?'--verde':'--rosso'})">${a}/${b}</span></div>`).join('')}</div>
    <div class="row"><button class="btn-main" id="nova">Nova avaliação</button><button id="temas">Temas</button></div>
  </section>
  ${erros.length?`<section class="card"><h3>Gabarito dos erros</h3>${erros.map(x=>`<div class="err" id="e${x.k}"><div><b>${x.k+1}.</b> ${esc(x.q.q)}</div><div class="a">✓ ${esc(x.q.o[x.q.c])}</div>${x.pick!==null?`<div class="m">✗ ${esc(x.q.o[x.pick])}</div>`:'<small>Não respondida</small>'}${x.q.n?`<small>${esc(x.q.n)}</small>`:''}</div>`).join('')}</section>`:''}`;
  bindBack();
  document.getElementById('nova').onclick=()=>prova();
  document.getElementById('temas').onclick=()=>go('');
  app.querySelectorAll('.grid40 button').forEach(b=>b.onclick=()=>{const e=document.getElementById('e'+b.dataset.k);if(e)e.scrollIntoView({block:'center'})});
  scrollTo(0,0);
}
route();
</script>
</body>
</html>
